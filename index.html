<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A simple mobile-friendly calculator for everyday calculations.">
<title>Simple Calculator</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:#eef2f7;font-family:Arial,sans-serif}
.calculator{width:100%;max-width:360px;padding:20px;border-radius:24px;background:#172033;box-shadow:0 14px 35px rgba(0,0,0,.18)}
h1{margin:0 0 14px;color:#fff;font-size:20px;font-weight:600}
.display{width:100%;min-height:82px;margin-bottom:16px;padding:18px 14px;border-radius:14px;background:#f8fafc;color:#172033;text-align:right;font-size:32px;overflow-wrap:anywhere;display:flex;align-items:center;justify-content:flex-end}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
button{min-height:58px;border:0;border-radius:14px;font-size:21px;font-weight:600;background:#334155;color:#fff;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
.utility{background:#64748b}.operator{background:#0d9488}.equals{background:#f59e0b;color:#172033}.zero{grid-column:span 2}
.hint{margin:14px 2px 0;color:#cbd5e1;font-size:12px;text-align:center}
</style>
</head>
<body>
<main class="calculator" aria-label="Calculator">
<h1>Simple Calculator</h1>
<div class="display" id="display" aria-live="polite">0</div>
<div class="keys">
<button class="utility" data-action="clear">AC</button><button class="utility" data-action="delete">⌫</button><button class="operator" data-op="÷">÷</button><button class="operator" data-op="×">×</button>
<button data-number="7">7</button><button data-number="8">8</button><button data-number="9">9</button><button class="operator" data-op="−">−</button>
<button data-number="4">4</button><button data-number="5">5</button><button data-number="6">6</button><button class="operator" data-op="+">+</button>
<button data-number="1">1</button><button data-number="2">2</button><button data-number="3">3</button><button class="equals" data-action="equals">=</button>
<button class="zero" data-number="0">0</button><button data-action="decimal">.</button><button data-action="sign">±</button>
</div>
<p class="hint">Works on your phone • No installation needed</p>
</main>
<script>
const display = document.getElementById('display');
let current='0', stored=null, operator=null, startNew=false;
function show(value){display.textContent=value}
function inputNumber(n){
 if(current==='Cannot divide by zero'||current==='Error'){current='0';startNew=false}
 if(startNew){current=n;startNew=false}
 else if(current==='0')current=n
 else if(current.length<16)current+=n;
 show(current)
}
function calculate(a,b,op){
 if(op==='+')return a+b;
 if(op==='−')return a-b;
 if(op==='×')return a*b;
 if(op==='÷')return b===0?null:a/b;
 return b
}
function tidy(n){if(!Number.isFinite(n))return 'Error';return String(Number(n.toPrecision(12)))}
document.querySelector('.keys').addEventListener('click',event=>{
 const btn=event.target.closest('button');if(!btn)return;
 if(btn.dataset.number!==undefined){inputNumber(btn.dataset.number);return}
 if(btn.dataset.op){
  if(current==='Cannot divide by zero'||current==='Error')return;
  const next=Number(current);
  if(operator&&!startNew){
   const result=calculate(stored,next,operator);
   if(result===null){current='Cannot divide by zero';stored=null;operator=null;show(current);startNew=true;return}
   current=tidy(result);show(current)
  }
  stored=Number(current);operator=btn.dataset.op;startNew=true;return
 }
 switch(btn.dataset.action){
  case 'clear':current='0';stored=null;operator=null;startNew=false;show(current);break;
  case 'delete':
   if(startNew||current==='Error'||current==='Cannot divide by zero'){current='0';startNew=false}
   else current=current.length>1?current.slice(0,-1):'0';
   show(current);break;
  case 'decimal':
   if(current==='Error'||current==='Cannot divide by zero'){current='0';startNew=false}
   if(startNew){current='0.';startNew=false}else if(!current.includes('.'))current+='.';
   show(current);break;
  case 'sign':
   if(current!=='0'&&current!=='Error'&&current!=='Cannot divide by zero')current=current.startsWith('-')?current.slice(1):'-'+current;
   show(current);break;
  case 'equals':
   if(operator&&stored!==null){
    const result=calculate(stored,Number(current),operator);
    current=result===null?'Cannot divide by zero':tidy(result);show(current);
    stored=null;operator=null;startNew=true
   }
 }
});
</script>
</body>
</html>
